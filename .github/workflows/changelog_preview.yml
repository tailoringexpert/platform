# This is a basic workflow that is manually triggered

name: changelog preview

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number"
        required: true

jobs:
  create-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Show user inputs
        run: |
          echo "Version: ${{ github.event.inputs.version }}"

      - name: Create tag
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/v${{ github.event.inputs.version }}',
              sha: context.sha
            })

      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate changelog
        id: generate_changelog
        uses: janheinrichmerker/action-github-changelog-generator@e60b5a2bd9fcd88dadf6345ff8327863fb8b490f
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filterByMilestone: true
          pullRequests: false
          prWoLabels: false
          unreleased: false
          dateFormat: "%m.%d.%Y"
          excludeLabels: "duplicate,question,invalid,wontfix,weekly-digest,dependencies"
          output: "CHANGELOG.md"

      - name: Upload changelog
        uses: actions/upload-artifact@v6
        with:
          path: CHANGELOG.md

      - name: Delete tag
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'tags/v${{ github.event.inputs.version }}',
              sha: context.sha
            })
