name: build

on:
  workflow_dispatch:
    inputs:
      DEPLOY:
        description: "Deploy to repo"
        type: boolean
        default: false
      RELEASE_BUILD:
        description: "Create a release"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
  GIT_COMMITTER_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}
  GIT_GPG_SIGNKEY_BASE64: ${{ secrets.GIT_GPG_SIGNKEY_BASE64 }}

  MAVEN_SETTINGS: './settings.xml'
  MAVEN_REPOSITORY: '/home/maven'
  MAVEN_CREDENTIALS_USR: ${{ secrets.MAVEN_CREDENTIALS_USR }}
  MAVEN_CREDENTIALS_PSW: ${{ secrets.MAVEN_CREDENTIALS_PSW }}
  MAVEN_GPG_SIGNKEY_BASE64: ${{ secrets.MAVEN_GPG_SIGNKEY }}
  MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOSTURL: ${{ vars.SONAR_HOSTURL }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    container:
      image: ${{ vars.CONTAINER_IMAGE }}
      env:
        GIT_WORKSPACE: ${{ github.workspace }}
        GIT_COMMITTER_NAME: ${{ env.GIT_COMMITTER_NAME }}
        GIT_COMMITTER_EMAIL: ${{ env.GIT_COMMITTER_EMAIL }}
        MAVEN_CREDENTIALS_USR: ${{ env.MAVEN_CREDENTIALS_USR }}
        MAVEN_CREDENTIALS_PSW: ${{ env.MAVEN_CREDENTIALS_PSW }}
        MAVEN_GPG_SIGNKEY_BASE64:  ${{ env.MAVEN_GPG_SIGNKEY_BASE64 }}
        MAVEN_GPG_PASSPHRASE: ${{ env.MAVEN_GPG_PASSPHRASE }}
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.RELEASE_BUILD == 'true' && 'develop' ||  github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup runtime env vars
        run: |
          echo "GIT_WORKSPACE=$(pwd)" >> $GITHUB_ENV
          echo "MAVEN_SETTINGS=$(pwd)/settings.xml" >> $GITHUB_ENV
          
          git config --global --add safe.directory $(pwd)

      - name: Branch name
        run: echo running on branch ${GITHUB_REF##*/}

      - name: Cache maven packages
        uses: actions/cache@v6
        with:
          path: $MAVEN_REPOSITORY
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Checkout badges branch dedicated to storing badges only
        uses: actions/checkout@v7
        with:
          ref: badges
          path: badges


      - name: Build
        run: |
          mvn --settings $MAVEN_SETTINGS \
              -Dmaven.repo.local=$MAVEN_REPOSITORY \
              -DskipTests \
            clean compile

      - name: Verify
        run: |
          mvn --settings $MAVEN_SETTINGS \
              -Dmaven.repo.local=$MAVEN_REPOSITORY \
            verify      

      - name: Generate Jacoco Badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@72266185b7ee48a6fd74eaf0238395cc8b14fef8
        with:
          badges-directory: badges
          generate-branches-badge: true
          jacoco-csv-file: tailoringexpert-coverage/target/site/jacoco-aggregate-ut/jacoco.csv

      - name: Log coverage percentage
        run: |
          echo "coverage = ${{ steps.jacoco.outputs.coverage }}"
          echo "branches = ${{ steps.jacoco.outputs.branches }}"

      - name: Commit and push
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          setup-git.sh

          cd badges
          if [[ `git status --porcelain ./*.svg` ]]; then
            git add ./*.svg
            git commit -m "Autogenerated JaCoCo coverage badge" ./*.svg
            git push
          fi

      - name: Upload Jacoco coverage report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: tailoringexpert-coverage/target/site/jacoco-aggregate-ut/
